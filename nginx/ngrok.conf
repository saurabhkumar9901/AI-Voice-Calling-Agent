# nginx front door for an ngrok tunnel (ngrok terminates TLS, so plain HTTP here).
# Used by docker-compose.ngrok.yaml; ngrok points at 127.0.0.1:8080.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Document/audio uploads.
    client_max_body_size 100M;

    # Recordings and uploaded documents (bucket uses unsigned URLs, so PUT and
    # GET must both pass through).
    location /voice-audio/ {
        proxy_pass http://minio:9000/voice-audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # UI (Next.js) - also proxies /api/* and WebSockets to the api service.
    location / {
        proxy_pass http://ui:3010;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # sub_filter cannot rewrite compressed bodies.
        proxy_set_header Accept-Encoding "";
        sub_filter 'http://localhost:9000/voice-audio/' 'https://$host/voice-audio/';
        sub_filter_once off;
        sub_filter_types application/json text/html;
    }
}
