###############################################################################
### OCI Always Free Ampere A1 — capacity hunter
###
### OCI's A1 free tier in ap-mumbai-1 is chronically out of capacity. There is
### no "off-hours": windows open at random and last seconds to minutes, so this
### polls continuously and stops as soon as it wins.
###
### Why GitHub Actions and not Vercel:
###   - Vercel Hobby crons run once per day, inside a one-hour window.
###   - Vercel Pro costs $20/mo for per-minute crons with a 300s function cap.
###   - This repo is public, so Actions minutes are free and unconstrained.
###
### Required repository secrets:
###   OCI_CLI_USER            - user OCID
###   OCI_CLI_TENANCY         - tenancy OCID
###   OCI_CLI_FINGERPRINT     - API key fingerprint
###   OCI_CLI_KEY_CONTENT_B64 - API private key, base64-encoded:
###                             base64 -w0 oci_api_key.pem
###############################################################################

name: a1-hunter

on:
  # Both triggers are needed, but neither alone is sufficient:
  #   - `schedule` is the restart mechanism, and it is unreliable: for a new
  #     workflow GitHub can queue it hours late or drop it entirely, so it
  #     cannot be what keeps the hunt alive.
  #   - `workflow_dispatch` is what keeps it alive: each run queues its own
  #     successor (see "Queue the next hunt"), which is the one event
  #     GITHUB_TOKEN is allowed to raise.
  #
  # Off-peak minutes, because GitHub delays cron hardest at :00 and :30.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probe capacity only — do not launch anything"
        type: boolean
        default: false

# Serialise runs. Chains are single-file by construction (one successor per
# run, and "Queue the next hunt" refuses to add a second), so a queued run
# only happens if cron or a human dispatches during a hunt. Those are allowed
# to wait rather than cancel, because a cancelled run would fork nothing but
# waste the attempts it had already made.
concurrency:
  group: a1-hunter
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # success/failure reports
  actions: write # the script disables this workflow once it wins

jobs:
  hunt:
    runs-on: ubuntu-latest
    # Budget: ~7.5 min of hunting (4 attempts) + the chain delay (3 min)
    # before the successor is queued. 12 min leaves headroom for a slow job
    # start without letting a stuck run hold the chain.
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI CLI
        run: pip install --disable-pip-version-check oci-cli

      - name: Write OCI API key
        env:
          OCI_KEY_B64: ${{ secrets.OCI_CLI_KEY_CONTENT_B64 }}
        run: |
          umask 077
          printf '%s' "$OCI_KEY_B64" | base64 -d > "$RUNNER_TEMP/oci_api_key.pem"
          test -s "$RUNNER_TEMP/oci_api_key.pem"

      - name: Verify key matches fingerprint
        env:
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/oci_api_key.pem"
          computed="$(openssl pkey -in "$key" -pubout -outform DER | openssl md5 -c | awk '{print $2}')"
          echo "key file:            $(wc -c < "$key") bytes"
          echo "key type:            $(openssl pkey -in "$key" -noout -text 2>/dev/null | head -n1 | tr -d ' ')"
          echo "computed fingerprint: $computed"
          echo "configured fingerprint: $OCI_CLI_FINGERPRINT"
          if [ "$computed" != "$OCI_CLI_FINGERPRINT" ]; then
            echo "::error::The private key in OCI_CLI_KEY_CONTENT_B64 does not match OCI_CLI_FINGERPRINT ($computed vs $OCI_CLI_FINGERPRINT). Every API call would fail with NotAuthenticated."
            exit 1
          fi
          echo "OK: key and fingerprint agree."

      - name: Hunt
        id: hunt
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: ${{ runner.temp }}/oci_api_key.pem
          OCI_CLI_REGION: ap-mumbai-1
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: bash scripts/hunt-a1.sh

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/oci_api_key.pem"

      # Self-chaining. `schedule` is unreliable enough that the hunt cannot
      # depend on it; this step is what actually keeps it running. Exits
      # without queueing when the hunt won (the workflow disables itself),
      # failed for a configuration reason, or another run is already pending.
      - name: Queue the next hunt
        if: success() && steps.hunt.outputs.won != '1' && steps.hunt.outputs.next_delay != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          delay="${{ steps.hunt.outputs.next_delay }}"
          case "$delay" in
            ''|*[!0-9]*) echo "::error::Unexpected chain delay: '$delay'"; exit 1 ;;
          esac

          # Guard against forking the chain: if cron fires while a chain is
          # already in flight, both would queue a successor and the run rate
          # would double. The current run is in_progress, so exclude it.
          pending="$(gh run list --workflow a1-hunter.yml --limit 30 \
            --json databaseId,status \
            | jq --arg id "$GITHUB_RUN_ID" \
                '[.[] | select(.status != "completed" and (.databaseId | tostring) != $id)] | length')"
          if [ "$pending" -gt 0 ]; then
            echo "Another hunt is already running or queued; not chaining."
            exit 0
          fi

          echo "Next hunt in ${delay}s."
          sleep "$delay"
          gh workflow run a1-hunter.yml --ref main
          echo "Queued."
